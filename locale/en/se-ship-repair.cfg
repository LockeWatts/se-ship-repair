[mod-name]
se-ship-repair=Space Exploration: Ship Repair

[mod-description]
se-ship-repair=Your first spaceship is the one you crashed in. The wreck at the crash site becomes a repair site: restore its hull, systems and propulsion in three stages, and it is rebuilt on the spot as a working Space Exploration spaceship. Adds costly crude recipes that make spaceships buildable from rocket science; Space Exploration's own recipes are unchanged.

[entity-name]
sesr-repair-site-hull=Crashed spaceship (hull repair)
sesr-repair-site-systems=Crashed spaceship (systems repair)
sesr-repair-site-propulsion=Crashed spaceship (propulsion repair)

[entity-description]
sesr-repair-site-hull=Your crashed ship. Supply the materials shown to rebuild its hull.
sesr-repair-site-systems=Your crashed ship, hull restored. Supply the materials shown to rebuild its console.
sesr-repair-site-propulsion=Your crashed ship, nearly whole. Supply the materials shown to rebuild its engine and booster tank. Needs the Spaceship repair technology.

[recipe-name]
sesr-crude-spaceship-console=Crude spaceship console
sesr-crude-spaceship-floor=Crude spaceship floor
sesr-crude-spaceship-wall=Crude spaceship wall
sesr-crude-spaceship-gate=Crude spaceship door
sesr-crude-spaceship-rocket-engine=Crude spaceship rocket engine
sesr-crude-spaceship-rocket-booster-tank=Crude spaceship rocket booster tank
sesr-crude-spaceship-ion-engine=Crude spaceship ion engine
sesr-crude-spaceship-ion-booster-tank=Crude spaceship ion booster tank
sesr-crude-spaceship-clamp=Crude spaceship clamp
sesr-repair-hull=Repair hull
sesr-repair-systems=Repair systems
sesr-repair-propulsion=Repair propulsion

