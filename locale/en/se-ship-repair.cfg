sesr-crude-spaceship-clamps=Crude spaceship docking clamps
sesr-crude-ion-engine=Crude ion engine
sesr-spaceship-repair=Spaceship repair

[technology-description]
sesr-crude-spaceship=Build spaceships the hard way, from the materials rockets are made of. The parts are the same as the proper ones but cost about twice as much.
sesr-crude-spaceship-clamps=A costly early way to build docking clamps, so spaceships can anchor to a specific location.
sesr-crude-ion-engine=A costly early way to build ion engines and ion booster tanks.
sesr-spaceship-repair=Restore the propulsion of your crashed ship, the last step in making it fly again.

[sesr]
repair-started=Your crashed ship can be repaired. Open the wreck to see what its hull needs. __1__
repair-site-placed=The wreck of your ship is gone, so a repair site has been placed near spawn. __1__
no-room-for-site=Ship Repair could not find room for the repair site within __2__ tiles of spawn. Clear some space there and it will be placed automatically. __1__
stage-complete-hull=Hull repaired. Next: the ship's systems. __1__
stage-complete-systems=Systems repaired. Next: propulsion, which needs the Spaceship repair technology. __1__
footprint-notice=The finished ship will stand on the outlined area, __1__ by __2__ tiles. Keep it clear.
footprint-blocked=The ship is ready to be rebuilt, but __1__ thing(s) are in the outlined area, such as __2__. Move them and it will be built automatically. __3__
ship-repaired=Your ship is repaired. Give it power and rocket fuel and it is ready to fly. __1__
ship-repaired-incomplete=Your ship has been rebuilt, but some parts could not be placed. Check its hull. __1__
command-advance-help=Finishes the current ship repair stage immediately. Admins only; meant for testing.
command-admin-only=Only admins can use this command.
command-nothing-to-advance=There is no repair stage in progress (state: __1__).
command-advanced=Finished the __1__ repair stage.
