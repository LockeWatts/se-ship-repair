name: Release

# Publishes the mod to the Factorio mod portal.
# Runs when a tag "v<version>" is pushed, where <version> matches info.json,
# or when started by hand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches info.json
        if: github.ref_type == 'tag'
        run: |
          version="$(jq -r .version info.json)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match info.json version $version" >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install lupa
      - name: Run mock tests
        run: python3 dev/mock_test.py
      - name: Build the mod zip
        run: |
          mkdir -p dist
          sh dev/package.sh dist
      - name: Publish to the mod portal
        env:
          FACTORIO_API_KEY: ${{ secrets.FACTORIO_API_KEY }}
        run: sh dev/publish.sh dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mod-zip
          path: dist/*.zip
